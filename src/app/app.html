<a class="btn fixed -top-20 left-4 z-50 focus:top-4" [routerLink]="[]" fragment="main-content"
  >Skip to content</a
>
<div class="drawer min-h-dvh bg-base-200 lg:drawer-open">
  <input
    id="navigation-drawer"
    #navigationToggle
    type="checkbox"
    class="drawer-toggle"
    [checked]="menuOpen"
    (change)="menuOpen = navigationToggle.checked"
  />
  <div class="drawer-content min-w-0">
    <button
      class="btn btn-ghost btn-square m-4 lg:hidden"
      aria-label="Toggle navigation"
      aria-controls="main-navigation"
      [attr.aria-expanded]="menuOpen"
      (click)="menuOpen = !menuOpen"
    >
      <svg lucideMenu [size]="20" aria-hidden="true"></svg>
    </button>
    <main id="main-content" class="mx-auto w-full max-w-screen-2xl p-4 md:p-8" tabindex="-1">
      <router-outlet />
    </main>
  </div>
  <div id="main-navigation" class="drawer-side z-40">
    <label for="navigation-drawer" class="drawer-overlay" aria-label="Close navigation"></label>
    <aside class="flex min-h-full w-64 flex-col bg-base-100 p-4">
      <a class="btn btn-ghost mb-6 text-lg" routerLink="/inventory" (click)="menuOpen = false"
        >Card Trader</a
      >
      <nav aria-label="Main navigation">
        <ul class="menu w-full gap-2">
          <li>
            <a
              routerLinkActive="menu-active"
              ariaCurrentWhenActive="page"
              routerLink="/inventory"
              (click)="menuOpen = false"
              ><svg lucideLayoutGrid [size]="18" aria-hidden="true"></svg>Inventory</a
            >
          </li>
          <li>
            <button disabled>
              <svg lucidePackageOpen [size]="18" aria-hidden="true"></svg>Pack Opening<span
                class="badge badge-ghost badge-sm"
                >Soon</span
              >
            </button>
          </li>
          <li>
            <button disabled>
              <svg lucideArrowLeftRight [size]="18" aria-hidden="true"></svg>Trading<span
                class="badge badge-ghost badge-sm"
                >Soon</span
              >
            </button>
          </li>
          <li>
            <a
              routerLink="/games"
              routerLinkActive="menu-active"
              ariaCurrentWhenActive="page"
              (click)="menuOpen = false"
            >
              <svg lucideGamepad2 [size]="18" aria-hidden="true"></svg>Games
            </a>
          </li>
        </ul>
      </nav>
      <nav class="mt-auto pt-6" aria-label="Account navigation">
        <ul class="menu w-full gap-2">
          @if (auth.session) {
            <li>
              <a
                routerLink="/profile"
                routerLinkActive="menu-active"
                ariaCurrentWhenActive="page"
                (click)="menuOpen = false"
              >
                <svg lucideUser [size]="18" aria-hidden="true"></svg>Profile
              </a>
            </li>
            <li>
              <button type="button" [disabled]="loggingOut" (click)="logout()">
                <svg lucideLogOut [size]="18" aria-hidden="true"></svg
                >{{ loggingOut ? 'Logging out…' : 'Log out' }}
              </button>
            </li>
          } @else {
            <li>
              <a
                routerLink="/login"
                routerLinkActive="menu-active"
                ariaCurrentWhenActive="page"
                (click)="menuOpen = false"
              >
                <svg lucideLogIn [size]="18" aria-hidden="true"></svg>Log in
              </a>
            </li>
            <li>
              <a
                routerLink="/register"
                routerLinkActive="menu-active"
                ariaCurrentWhenActive="page"
                (click)="menuOpen = false"
                ><svg lucideUserPlus [size]="18" aria-hidden="true"></svg>Register</a
              >
            </li>
          }
        </ul>
        @if (accountMessage) {
          <p class="px-3 text-sm" role="alert">{{ accountMessage }}</p>
        }
      </nav>
      <label class="flex items-center justify-between gap-3 pt-6">
        <span class="text-sm">Theme</span>
        <select
          class="select select-sm w-32"
          aria-label="Theme"
          #themeSelect
          [value]="theme"
          (change)="changeTheme(themeSelect.value)"
        >
          <option value="system">System</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </label>
    </aside>
  </div>
</div>
