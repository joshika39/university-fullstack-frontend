<section class="mx-auto max-w-sm py-6 md:py-12" aria-labelledby="register-heading">
  <h1 id="register-heading" class="text-3xl font-semibold">Create an account</h1>
  <p class="mt-2 text-sm text-base-content/60">Join Card Trader.</p>
  <div class="card card-border mt-6 bg-base-100">
    <form class="card-body gap-5" ngNativeValidate (ngSubmit)="register()">
      <label class="flex flex-col gap-2">
        <span class="text-sm font-medium">Username</span>
        <input
          class="input w-full"
          type="text"
          name="username"
          autocomplete="username"
          maxlength="256"
          required
          [(ngModel)]="username"
        />
      </label>
      <label class="flex flex-col gap-2">
        <span class="text-sm font-medium">Email</span>
        <input
          class="input w-full"
          type="email"
          name="email"
          autocomplete="email"
          required
          [(ngModel)]="email"
        />
      </label>
      <label class="flex flex-col gap-2">
        <span class="text-sm font-medium">Password</span>
        <input
          class="input w-full"
          type="password"
          name="password"
          autocomplete="new-password"
          minlength="6"
          required
          [(ngModel)]="password"
        />
      </label>
      <label class="flex flex-col gap-2">
        <span class="text-sm font-medium">Confirm password</span>
        <input
          class="input w-full"
          type="password"
          name="confirmPassword"
          autocomplete="new-password"
          required
          [(ngModel)]="confirmPassword"
        />
      </label>
      <button class="btn btn-neutral w-full" type="submit" [disabled]="busy">
        {{ busy ? 'Creating account…' : 'Create account' }}
      </button>
      @if (message) {
        <p class="text-sm text-base-content/70" role="alert">{{ message }}</p>
      }
    </form>
  </div>
  <p class="mt-5 text-center text-sm text-base-content/70">
    Already have an account? <a class="link" routerLink="/login">Log in</a>
  </p>
</section>
