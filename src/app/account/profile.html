<section class="mx-auto max-w-sm py-6 md:py-12" aria-labelledby="profile-heading">
  <h1 id="profile-heading" class="text-3xl font-semibold">Profile</h1>
  <p class="mt-2 text-sm text-base-content/60">Your Card Trader account.</p>
  <div class="card card-border mt-6 bg-base-100">
    <div class="card-body gap-6">
      @if (loading) {
        <p class="text-sm text-base-content/60" role="status">Loading profile…</p>
      } @else if (user) {
        <dl class="space-y-5">
          <div>
            <dt class="text-sm text-base-content/60">Username</dt>
            <dd class="mt-1 break-words font-medium">{{ user.userName }}</dd>
          </div>
          <div>
            <dt class="text-sm text-base-content/60">Email</dt>
            <dd class="mt-1 break-words">{{ user.email }}</dd>
          </div>
        </dl>
      } @else {
        <p class="text-sm" role="alert">{{ message }}</p>
        <button class="btn btn-neutral" type="button" (click)="loadProfile()">Try again</button>
      }
    </div>
  </div>
</section>
